name: Refresh contribution graph

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kidus-der
          SETTING_JSON: .github/profile-3d.json

      - name: Trim language pie and star/fork counters
        run: |
          mkdir -p profile
          mv profile-3d-contrib/contrib-3d-*.svg profile/
          python3 scripts/trim_3d.py profile/contrib-3d-dark.svg profile/contrib-3d-light.svg

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh contribution graph" || exit 0
          git push
