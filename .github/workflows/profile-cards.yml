name: Refresh profile cards

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARD_BASE: username=kidus-der&hide_border=true&bg_color=00000000
  DARK: title_color=E8B06A&icon_color=E8B06A&ring_color=E8B06A&text_color=C9D1D9
  LIGHT: title_color=A8641A&icon_color=A8641A&ring_color=A8641A&text_color=3B434B

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.CARD_BASE }}&${{ env.DARK }}&show_icons=true&include_all_commits=true&custom_title=on github
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.CARD_BASE }}&${{ env.LIGHT }}&show_icons=true&include_all_commits=true&custom_title=on github
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.CARD_BASE }}&${{ env.DARK }}&layout=compact&langs_count=8&custom_title=most used languages
          path: profile/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.CARD_BASE }}&${{ env.LIGHT }}&layout=compact&langs_count=8&custom_title=most used languages
          path: profile/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kidus-der
          SETTING_JSON: .github/profile-3d.json

      - name: Commit cards
        run: |
          mkdir -p profile
          mv profile-3d-contrib/contrib-3d-*.svg profile/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh profile cards" || exit 0
          git push
